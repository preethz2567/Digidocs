name: DigiDocs CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Setting up Java 21 since the pom.xml is configured for Java 21,
      # even though Java 17 was requested. Using 17 would fail the build.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: ./mvnw -B package --file pom.xml
        env:
          # Use GitHub Actions Secrets to avoid printing/committing sensitive data
          DB_URL: "jdbc:postgresql://localhost:5432/digidocs"
          DB_USERNAME: "postgres"
          DB_PASSWORD: "${{ secrets.DB_PASSWORD }}"
          JWT_SECRET: "${{ secrets.JWT_SECRET }}"
          JWT_EXPIRATION: "86400000"
          AWS_REGION: "${{ secrets.AWS_REGION }}"
          AWS_S3_BUCKET: "${{ secrets.AWS_S3_BUCKET }}"
          CORS_ORIGINS: "http://localhost:5173"

  frontend:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Type Check & Build
        run: npm run build
        env:
          VITE_API_BASE_URL: "${{ secrets.VITE_API_BASE_URL }}"
